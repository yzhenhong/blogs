<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>YangZhenHong Blogs</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta
      name="description"
      content="YangZhenHong 的前端开发笔记，涵盖 JavaScript、TypeScript、Vue、React、跨端开发、性能优化与 SEO。"
    />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <!-- 设置浏览器图标 -->
    <link rel="icon" href="./favicon.svg" type="image/x-icon" />
    <link rel="shortcut icon" href="./favicon.svg" type="image/x-icon" />
    <!-- 默认主题 -->
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css"
    />
    <!-- 侧边栏分组折叠样式 -->
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css"
    />

    <style>
      nav.app-nav li ul {
        min-width: 100px;
      }

      #carbonads {
        box-shadow: none !important;
        width: auto !important;
      }

      main {
        width: 100%;
      }
    </style>
  </head>

  <body>
    <!-- 定义加载时候的动作 -->
    <div id="app">加载中...</div>

    <script>
      window.$docsify = {
        // 项目名称
        name: "YangZhenHong Blogs",
        // 仓库地址，点击右上角的Github章鱼猫头像会跳转到此地址
        repo: "https://github.com/yzhenhong",
        // 侧边栏支持，默认加载的是项目根目录下的_sidebar.md文件
        loadSidebar: true,
        // 导航栏支持，默认加载的是项目根目录下的_navbar.md文件
        loadNavbar: true,
        // 封面支持，默认加载的是项目根目录下的_coverpage.md文件
        coverpage: false,
        // 最大支持渲染的标题层级
        maxLevel: 5,
        // 自定义侧边栏后默认不会再生成目录，设置生成目录的最大层级（建议配置为2-4）
        subMaxLevel: 4,
        // 默认收起所有分组，点击分组标题可以展开子菜单
        sidebarDisplayLevel: 1,
        // 小屏设备下合并导航栏到侧边栏
        mergeNavbar: true,
        // 兼容目录整理前已经发布的旧链接
        alias: {
          "/css/(.*)": "/frontend-basics/css/$1",
          "/js/(.*)": "/frontend-basics/js/$1",
          "/ts/(.*)": "/frontend-basics/ts/$1",
          "/vue/(.*)": "/frontend-frameworks/vue/$1",
          "/react/(.*)": "/frontend-frameworks/react/$1",
          "/nuxt/(.*)": "/frontend-frameworks/nuxt/$1",
          "/next/(.*)": "/frontend-frameworks/next/$1",
          "/seo/(.*)": "/engineering-quality/seo/$1",
          "/optimization/(.*)": "/engineering-quality/optimization/$1",
          "/files/css%E5%B8%B8%E8%A7%81%E6%A0%B7%E5%BC%8F/README": "/frontend-basics/css/common-styles/index",
          "/files/css%E4%BC%98%E5%85%88%E7%BA%A7/README": "/frontend-basics/css/specificity/index",
          "/files/js%E6%95%B0%E6%8D%AE%E7%B1%BB%E5%9E%8B%E4%BB%A5%E5%8F%8A%E5%88%A4%E6%96%AD/README": "/frontend-basics/js/data-types/index",
          "/files/js%E6%95%B0%E7%BB%84%E7%9A%84%E5%B8%B8%E7%94%A8%E6%96%B9%E6%B3%95/README": "/frontend-basics/js/array-methods/index",
          "/files/js%E5%AF%B9%E8%B1%A1%E7%9A%84%E5%B8%B8%E7%94%A8%E6%96%B9%E6%B3%95/README": "/frontend-basics/js/object-methods/index",
          "/files/js%E5%88%A4%E6%96%AD%E5%AF%B9%E8%B1%A1%E6%95%B0%E7%BB%84%E4%B8%AD%E6%98%AF%E5%90%A6%E5%AD%98%E5%9C%A8%E6%9F%90%E4%B8%AA%E5%AF%B9%E8%B1%A1/README": "/frontend-basics/js/array-object-lookup/index",
          "/files/%E5%87%BD%E6%95%B0/README": "/frontend-basics/js/functions/index",
          "/files/javascript%E7%9A%84new%E8%BF%90%E7%AE%97%E7%AC%A6/README": "/frontend-basics/js/new-operator/index",
          "/files/%E9%98%B2%E6%8A%96%E5%92%8C%E8%8A%82%E6%B5%81/README": "/frontend-basics/js/debounce-throttle/index",
          "/files/%E6%B7%B1%E5%BA%A6%E4%BC%98%E5%85%88%E9%81%8D%E5%8E%86%E5%92%8C%E5%B9%BF%E5%BA%A6%E4%BC%98%E5%85%88%E9%81%8D%E5%8E%86/README": "/frontend-basics/js/traversal/index",
          "/files/typescript/README": "/frontend-basics/ts/getting-started/index",
          "/files/%E5%B0%8F%E7%A8%8B%E5%BA%8Fstorage%E8%AE%BE%E7%BD%AE%E6%97%B6%E9%97%B4/README": "/cross-platform/mini-program/storage-expiration/index",
          "/files/git%E4%BD%BF%E7%94%A8/README": "/tool/git/index",
          "/files/%E6%95%B0%E6%8D%AE%E5%BA%93%E5%AE%89%E8%A3%85/README": "/tool/database/index",
          "/files/%E6%95%B0%E6%8D%AE%E5%BA%93%E5%AE%89%E8%A3%85/(.*)": "/tool/database/$1",
        },
        /*搜索相关设置*/
        search: {
          maxAge: 86400000, // 过期时间，单位毫秒，默认一天
          paths: "auto", // 注意：仅适用于 paths: 'auto' 模式
          // 支持本地化
          placeholder: {
            "/": "搜索文章",
          },
          noData: "找不到结果",
          depth: 4,
          hideOtherSidebarContent: false,
        },
      };
    </script>
    <!-- docsify的js依赖 -->
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
    <!-- 侧边栏分组折叠 -->
    <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
    <!-- emoji表情支持 -->
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
    <!-- 图片放大缩小支持 -->
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
    <!-- 搜索功能支持 -->
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
    <!--在所有的代码块上添加一个简单的Click to copy按钮来允许用户从你的文档中轻易地复制代码-->
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  </body>
</html>
